# Corporate Attendance & Payroll — `docker compose up -d --build`
#   App:      http://localhost:3000        (ZKTeco devices push to http://<this-host>:3000/iclock/cdata)
#   Demo:     SEED_DEMO=true (default) creates demo employees + 3 months of punches on first start
#   HTTPS:    docker compose --profile https up -d   (set DOMAIN and TRUST_PROXY=1 in .env; needed for phone push notifications)
name: attendance-payroll

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payroll}
      POSTGRES_DB: payroll
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the app container can reach the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://payroll:${POSTGRES_PASSWORD:-payroll}@db:5432/payroll
      TZ_DEFAULT: ${TZ_DEFAULT:-Asia/Dhaka}
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Optional HTTPS front door (automatic certificates) — required for installing the PWA and receiving push on phones.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
